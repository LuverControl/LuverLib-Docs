import org.gradle.internal.os.OperatingSystem

pluginManagement {
    repositories {
        def wpilibRoot = OperatingSystem.current().isWindows()
            ? new File(System.getenv('PUBLIC') ?: 'C:\\Users\\Public', 'wpilib/2026')
            : new File(System.getProperty('user.home'), 'wpilib/2026')
        maven { url = new File(wpilibRoot, 'maven') }
        gradlePluginPortal()
    }
}

rootProject.name = 'luverlib'
